# DragonOS CI — typecheck and lint every push and PR.
# The production build is intentionally NOT part of CI: deploys are built by
# Vercel with the exact same command, so running it twice adds minutes and
# catches nothing new.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun tsc -b --noEmit

      - name: Lint
        run: bun run lint
